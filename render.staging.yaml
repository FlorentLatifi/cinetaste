# Render Blueprint — STAGING only
# https://render.com/docs/blueprint-spec
#
# Apply SEPARATELY from production `render.yaml` so names never collide:
#   Render → New → Blueprint → select this file (or branch) → cinetaste-*-staging
#
# After first deploy:
#   1. Set TMDB_API_KEY (optional) and CORS_ORIGINS to your Vercel staging / preview URL
#   2. SQL on staging DB: CREATE EXTENSION IF NOT EXISTS vector;
#   3. SPA: VITE_API_BASE_URL=https://cinetaste-api-staging.onrender.com/api/v1
#
# Never reuse production DATABASE_URL / JWT_SECRET here.

services:
  - type: web
    name: cinetaste-api-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/ready
    # Auto-deploy from master is fine for a personal beta; pin a staging branch if preferred.
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: CineTaste Staging
      # Update after Vercel staging / preview domain is known
      - key: CORS_ORIGINS
        value: https://cinetaste-staging.vercel.app
      - key: PUBLIC_APP_URL
        value: https://cinetaste-staging.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinetaste-db-staging
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: WATCH_PROVIDER_REGION
        value: "US"
      # Rate limiting no longer needs Redis: counters live in-process
      # when REDIS_URL is empty (one worker on the free plan).
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: REDIS_URL
        value: ""
      # Vercel rewrite -> Render = two proxies appending X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # The SPA proxies /api through its own domain, so the refresh
      # cookie is first-party (Safari blocks third-party cookies).
      - key: COOKIE_SAMESITE
        value: lax
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SENTRY_DSN
        sync: false
      # Password reset needs SMTP; without it the endpoint returns 503
      # (it never logs or returns the token). Any provider works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      - key: SENTRY_RELEASE
        value: staging

databases:
  - name: cinetaste-db-staging
    plan: free
    postgresMajorVersion: "16"
    # After first deploy, run via Render dashboard SQL or psql:
    #   CREATE EXTENSION IF NOT EXISTS vector;
    #   CREATE EXTENSION IF NOT EXISTS pg_trgm;
#
# After the first deploy (Render shell):
#   python -m app.scripts.ingest_catalog --pages 10   # needs TMDB_API_KEY
#   python -m app.scripts.reembed_catalog             # after embedding changes
