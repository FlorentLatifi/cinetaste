name: Catalog

# Fills and refreshes the production catalog from TMDb without a laptop.
#
# Render's free plan has no shell, so the only other way to run the ingest is
# from a personal machine against the external database URL. A full run takes a
# long time from Europe to Oregon and dies if the lid closes. A GitHub runner
# sits close to the database and is not someone's laptop.
#
# Re-running is safe: titles are upserted by TMDb id, and every batch commits
# on its own, so an interrupted run keeps what it wrote.
#
# Set these repository secrets to switch it on (Settings → Secrets and
# variables → Actions → Secrets):
#   DATABASE_URL  the API's connection string (Neon → Connect, pooling off)
#   TMDB_API_KEY  https://www.themoviedb.org/settings/api
# Then Actions → Catalog → Run workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "popular = deck + mainstream + discovery passes; plan = count what popular would fetch (TMDb only, writes nothing); seed-only = onboarding deck only"
        type: choice
        options: [popular, plan, seed-only]
        default: popular
      pages:
        description: "Mainstream discover pages per sort and media type (20 titles each)"
        type: number
        default: 10
      rated_pages:
        description: "Top-rated movie pages (vote_average.desc, 250+ votes). Empty = 30, 0 = off"
        type: string
        default: ""
      language_pages:
        description: "Top-rated pages per language in `languages`. Empty = 6, 0 = off"
        type: string
        default: ""
      languages:
        description: "Comma-separated ISO 639-1 codes, or none. Empty = ko,ja,fr,es,it,de,hi,pt,zh,da,sv,fa"
        type: string
        default: ""
      decade_pages:
        description: "Top-rated pages per decade in `decades`. Empty = 10, 0 = off"
        type: string
        default: ""
      decades:
        description: "Comma-separated decade starts (1970,1980), or none. Empty = 1940..2020"
        type: string
        default: ""
      tv_pages:
        description: "Top-rated TV pages, overall and per language. Empty = 8 and 2, 0 = no extra TV"
        type: string
        default: ""
      refresh_existing:
        description: "Re-fetch titles already stored, even ones only discovery passes found"
        type: boolean
        default: false
  # Monthly, so new releases and shifting popularity reach recommendations.
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

# Never two ingests at once: they would fetch the same titles twice. A queued
# run waits instead of cancelling one that is halfway through.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest TMDb catalog
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # The script only reads the database and TMDb settings; these exist so
      # Settings validates. No Redis, no tokens issued.
      APP_ENV: local
      APP_DEBUG: "false"
      REDIS_URL: ""
      JWT_SECRET: catalog-ingest-only-never-signs-a-token-000000
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        run: |
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          [ -n "$TMDB_API_KEY" ] || missing="$missing TMDB_API_KEY"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Secrets not set:$missing — skipping the scheduled refresh."
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Set repository secrets:$missing (see the comment at the top of catalog.yml)"
            exit 1
          fi
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::DATABASE_URL points at localhost. Use the hosted database's connection string."
              exit 1 ;;
          esac

      - uses: actions/setup-python@v7
        if: env.SKIP != '1'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      - name: Ingest
        if: env.SKIP != '1'
        env:
          MODE: ${{ inputs.mode || 'popular' }}
          PAGES: ${{ inputs.pages || 10 }}
          RATED_PAGES: ${{ inputs.rated_pages }}
          LANGUAGE_PAGES: ${{ inputs.language_pages }}
          LANGUAGES: ${{ inputs.languages }}
          DECADE_PAGES: ${{ inputs.decade_pages }}
          DECADES: ${{ inputs.decades }}
          TV_PAGES: ${{ inputs.tv_pages }}
          REFRESH: ${{ inputs.refresh_existing }}
        run: |
          # Inputs reach the script only through env vars and quoted args, never
          # interpolated into the shell. Empty means "use the script's default"
          # (which is why these are strings: a number input can't say "unset").
          if [ "$MODE" = "seed-only" ]; then
            python -m app.scripts.ingest_catalog --seed-only
            exit 0
          fi
          args=(--pages "$PAGES")
          [ "$MODE" = "plan" ] && args+=(--dry-run)
          [ -n "$RATED_PAGES" ] && args+=(--rated-pages "$RATED_PAGES")
          [ -n "$LANGUAGE_PAGES" ] && args+=(--language-pages "$LANGUAGE_PAGES")
          [ -n "$LANGUAGES" ] && args+=(--languages "$LANGUAGES")
          [ -n "$DECADE_PAGES" ] && args+=(--decade-pages "$DECADE_PAGES")
          [ -n "$DECADES" ] && args+=(--decades "$DECADES")
          if [ -n "$TV_PAGES" ]; then
            args+=(--tv-rated-pages "$TV_PAGES" --tv-language-pages "$TV_PAGES")
          fi
          [ "$REFRESH" = "true" ] && args+=(--refresh-existing)
          python -m app.scripts.ingest_catalog "${args[@]}"
