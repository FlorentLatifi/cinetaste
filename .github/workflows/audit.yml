name: Dependency audit

# Known-vulnerable dependencies, checked on their own schedule rather than in
# CI. An advisory published tomorrow must not turn every unrelated PR red; it
# should fail here, where the failure email says exactly what to upgrade.
#
# Runs weekly, and on any change to the dependency files so an upgrade is
# checked before it merges.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r backend/requirements.txt

  node:
    name: Node (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Only what ships to browsers can hurt users; build tooling is
      # reported but does not fail the job.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report build tooling
        run: npm audit --audit-level=high || true
