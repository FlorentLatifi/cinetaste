<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CineTaste — movie and TV recommendations that understand your taste."
    />
    <title>CineTaste</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0c10" />
    <meta property="og:site_name" content="CineTaste" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CineTaste — Taste-First Movie Discovery" />
    <meta
      property="og:description"
      content="Rate three films. Get tonight's picks. Every pick explained."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CineTaste: rate three films, get tonight's picks." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var ck = "ct_contrast";
          var cv = localStorage.getItem(ck);
          if (cv === "high" || cv === "normal") {
            document.documentElement.setAttribute("data-contrast", cv);
          } else if (window.matchMedia("(prefers-contrast: more)").matches) {
            document.documentElement.setAttribute("data-contrast", "high");
          } else {
            document.documentElement.setAttribute("data-contrast", "normal");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-contrast", "normal");
        }
        try {
          var tk = "ct_color_scheme";
          var tv = localStorage.getItem(tk);
          var theme = "dark";
          if (tv === "light") theme = "light";
          else if (tv === "dark") theme = "dark";
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e2) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
