[project]
name = "cinetaste-backend"
version = "0.1.0"
description = "CineTaste recommendation platform API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: hits real Postgres + Redis (skipped when unavailable)",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs database work inside greenlets, and coverage
# does not follow a greenlet switch without being told to. Without this the
# report silently understates every path that touches the database: the whole
# body of the interactions endpoint and of recompute_profile read as dead code
# while the tests that drive them pass. Measured on this suite, it moves the
# total from 80% to 84% and recommendation_service from 59% to 87%.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented style puts these in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"app/scripts/*" = ["E501"]
