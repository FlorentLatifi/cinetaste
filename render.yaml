# Render Blueprint — PRODUCTION
# https://render.com/docs/blueprint-spec
# Connect this repo in Render and apply the blueprint, then set secrets in the dashboard.
# Staging twin (separate names/DB): see render.staging.yaml

services:
  - type: web
    name: cinetaste-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      # Set this BEFORE first deploy to your real Vercel URL (required in production).
      # Temporary placeholder is OK; update after Vercel is live, then redeploy.
      - key: CORS_ORIGINS
        value: https://cinetaste.vercel.app
      - key: PUBLIC_APP_URL
        value: https://cinetaste.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinetaste-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: WATCH_PROVIDER_REGION
        value: "US"
      # Rate limiting no longer needs Redis: counters live in-process
      # when REDIS_URL is empty (one worker on the free plan).
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: REDIS_URL
        value: ""
      # Reject requests with a Host we do not serve. The list must cover every
      # way the API is legitimately reached: its own Render hostname, the SPA
      # domain (Vercel proxies /api through it), Vercel preview domains, and
      # localhost for the container health check. Add a custom domain here
      # before pointing DNS at it, or the API will answer 400.
      - key: TRUSTED_HOSTS
        value: cinetaste-api.onrender.com,cinetaste.vercel.app,*.vercel.app,localhost,127.0.0.1
      # Vercel rewrite -> Render = two proxies appending X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      # The SPA proxies /api through its own domain, so the refresh
      # cookie is first-party (Safari blocks third-party cookies).
      - key: COOKIE_SAMESITE
        value: lax
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_NAME
        value: CineTaste
      - key: SENTRY_DSN
        sync: false
      # Password reset needs SMTP; without it the endpoint returns 503
      # (it never logs or returns the token). Any provider works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

databases:
  - name: cinetaste-db
    plan: free
    postgresMajorVersion: "16"
    # After first deploy, run via Render dashboard SQL or psql:
    #   CREATE EXTENSION IF NOT EXISTS vector;
    #   CREATE EXTENSION IF NOT EXISTS pg_trgm;
    # The 0006 migration also runs these; this comment is a reminder.
#
# After the first deploy (Render shell):
#   python -m app.scripts.ingest_catalog --pages 10   # needs TMDB_API_KEY
#   python -m app.scripts.reembed_catalog             # after embedding changes
